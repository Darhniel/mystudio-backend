    PatchedEquipmentAdminRequest:
      type: object
      description: |-
        Create/update payload and administrative representation of an item.

        ``image`` uploads or replaces the single image; ``remove_image`` clears it.
        Both are write-only, and ``cloudinary_public_id`` is never exposed here.
        ``remove_image`` is rejected on create since there is no image to remove.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        fixed_price_kobo:
          type: integer
          maximum: 2147483647
          minimum: 1
        stock_quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
          description: Inactive items are hidden from customers and kept for history.
        image:
          type: string
          format: binary
          writeOnly: true
        remove_image:
          type: boolean
          writeOnly: true
          default: false
