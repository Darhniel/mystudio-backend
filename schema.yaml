openapi: 3.0.3
info:
  title: MyStudio API
  version: 1.0.0
  description: 'API for the MyStudio studio and equipment rental platform: accounts,
    studios, equipment, bookings and Paystack payments.'
paths:
  /api/v1/:
    get:
      operationId: root_retrieve
      description: Lists the available API groups. Useful for smoke checks and clients.
      summary: API root
      tags:
      - meta
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Returns the service status and verifies database connectivity.
      summary: Service health
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Obtain a JWT pair with email and password.
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyStudioTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyStudioTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyStudioTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Exchange a refresh token for a new access token.
      summary: Refresh an access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify/:
    post:
      operationId: auth_verify_create
      description: Check whether a token is still valid.
      summary: Verify a token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist a refresh token so it can no longer be used.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Read or update the authenticated user's profile.
      summary: Get the current user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Read or update the authenticated user's profile.
      summary: Update the current user's profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Change the authenticated user's password.
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/studios/:
    get:
      operationId: studios_list
      description: Public, paginated list of active studios.
      summary: List active studios
      parameters:
      - in: query
        name: capacity_max
        schema:
          type: integer
      - in: query
        name: capacity_min
        schema:
          type: integer
      - in: query
        name: hourly_rate_max
        schema:
          type: integer
      - in: query
        name: hourly_rate_min
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - studios
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudioListList'
          description: ''
  /api/v1/studios/{slug}/images/:
    post:
      operationId: studios_images_create
      description: Add an image to a studio via multipart/form-data.
      summary: Upload a studio image
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - studios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioImageUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudioImageUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudioImageUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioImage'
          description: ''
  /api/v1/studios/{slug}/images/{image_id}/:
    patch:
      operationId: studios_images_partial_update
      description: Update the metadata of one image or remove it and its Cloudinary
        asset.
      summary: Update a studio image's metadata
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - studios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStudioImageUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStudioImageUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudioImageUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioImage'
          description: ''
    delete:
      operationId: studios_images_destroy
      description: Update the metadata of one image or remove it and its Cloudinary
        asset.
      summary: Delete a studio image
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - studios
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/studios/{slug}/:
    get:
      operationId: studios_retrieve
      description: Public detail page for an active studio; inactive studios are 404.
      summary: Retrieve an active studio
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - studios
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioDetail'
          description: ''
  /api/v1/equipment/:
    get:
      operationId: equipment_list
      description: Public, paginated list of active equipment.
      summary: List active equipment
      parameters:
      - in: query
        name: fixed_price_max
        schema:
          type: integer
      - in: query
        name: fixed_price_min
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - equipment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEquipmentPublicList'
          description: ''
  /api/v1/equipment/{equipment_id}/image/:
    post:
      operationId: equipment_image_create
      description: |-
        Upload, replace or remove the image of one equipment item.

        This endpoint is retained for backwards compatibility. The administrative
        create/update endpoints also accept image operations via the serializer.
      summary: Upload or replace an equipment image
      parameters:
      - in: path
        name: equipment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - equipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentImageUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EquipmentImageUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EquipmentImageUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentImage'
          description: ''
    put:
      operationId: equipment_image_update
      description: |-
        Upload, replace or remove the image of one equipment item.

        This endpoint is retained for backwards compatibility. The administrative
        create/update endpoints also accept image operations via the serializer.
      summary: Replace an equipment image
      parameters:
      - in: path
        name: equipment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - equipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentImageUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EquipmentImageUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EquipmentImageUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentImage'
          description: ''
    delete:
      operationId: equipment_image_destroy
      description: |-
        Upload, replace or remove the image of one equipment item.

        This endpoint is retained for backwards compatibility. The administrative
        create/update endpoints also accept image operations via the serializer.
      summary: Remove an equipment image
      parameters:
      - in: path
        name: equipment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - equipment
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/studios/:
    get:
      operationId: admin_studios_list
      description: |-
        Administrative list and creation endpoint for studios.

        Owner/manager accounts may create; staff accounts may read. Only JWT
        authentication is accepted.
      summary: List studios (including inactive)
      parameters:
      - in: query
        name: capacity_max
        schema:
          type: integer
      - in: query
        name: capacity_min
        schema:
          type: integer
      - in: query
        name: hourly_rate_max
        schema:
          type: integer
      - in: query
        name: hourly_rate_min
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-studios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudioAdminList'
          description: ''
    post:
      operationId: admin_studios_create
      description: |-
        Administrative list and creation endpoint for studios.

        Owner/manager accounts may create; staff accounts may read. Only JWT
        authentication is accepted.
      summary: Create a studio
      tags:
      - admin-studios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudioAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudioAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioAdmin'
          description: ''
  /api/v1/admin/studios/{studio_id}/images/:
    post:
      operationId: admin_studios_images_create
      description: Add an image to a studio via multipart/form-data (administrative).
      summary: Upload a studio image
      parameters:
      - in: path
        name: studio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-studios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioImageUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudioImageUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudioImageUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioImage'
          description: ''
  /api/v1/admin/studios/{studio_id}/images/{image_id}/:
    patch:
      operationId: admin_studios_images_partial_update
      description: Update one image's metadata or remove it and its Cloudinary asset.
      summary: Update a studio image's metadata
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: studio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-studios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStudioImageUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStudioImageUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudioImageUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioImage'
          description: ''
    delete:
      operationId: admin_studios_images_destroy
      description: Update one image's metadata or remove it and its Cloudinary asset.
      summary: Delete a studio image
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: studio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-studios
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/studios/{studio_id}/:
    get:
      operationId: admin_studios_retrieve
      description: Administrative retrieve, update and deactivate endpoint for one
        studio.
      summary: Retrieve a studio
      parameters:
      - in: path
        name: studio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-studios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioAdmin'
          description: ''
    put:
      operationId: admin_studios_update
      description: Administrative retrieve, update and deactivate endpoint for one
        studio.
      summary: Replace a studio
      parameters:
      - in: path
        name: studio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-studios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudioAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudioAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioAdmin'
          description: ''
    patch:
      operationId: admin_studios_partial_update
      description: Administrative retrieve, update and deactivate endpoint for one
        studio.
      summary: Partially update a studio
      parameters:
      - in: path
        name: studio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-studios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStudioAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStudioAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudioAdminRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioAdmin'
          description: ''
    delete:
      operationId: admin_studios_destroy
      description: Deactivates the studio and keeps its row and images for history.
      summary: Deactivate a studio
      parameters:
      - in: path
        name: studio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-studios
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/equipment/:
    get:
      operationId: admin_equipment_list
      description: |-
        Administrative list and creation endpoint for equipment.

        Owner/manager accounts may create; staff accounts may read. Creation
        accepts JSON or multipart/form-data when an ``image`` is supplied. Only JWT
        authentication is accepted.
      summary: List equipment (including inactive)
      parameters:
      - in: query
        name: fixed_price_max
        schema:
          type: integer
      - in: query
        name: fixed_price_min
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-equipment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEquipmentAdminList'
          description: ''
    post:
      operationId: admin_equipment_create
      description: |-
        Administrative list and creation endpoint for equipment.

        Owner/manager accounts may create; staff accounts may read. Creation
        accepts JSON or multipart/form-data when an ``image`` is supplied. Only JWT
        authentication is accepted.
      summary: Create an equipment item
      tags:
      - admin-equipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EquipmentAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EquipmentAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAdmin'
          description: ''
  /api/v1/admin/equipment/{equipment_id}/:
    get:
      operationId: admin_equipment_retrieve
      description: Administrative retrieve, update and deactivate endpoint for one
        item.
      summary: Retrieve an equipment item
      parameters:
      - in: path
        name: equipment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-equipment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAdmin'
          description: ''
    put:
      operationId: admin_equipment_update
      description: Administrative retrieve, update and deactivate endpoint for one
        item.
      summary: Replace an equipment item
      parameters:
      - in: path
        name: equipment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-equipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EquipmentAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EquipmentAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAdmin'
          description: ''
    patch:
      operationId: admin_equipment_partial_update
      description: Administrative retrieve, update and deactivate endpoint for one
        item.
      summary: Partially update an equipment item
      parameters:
      - in: path
        name: equipment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-equipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEquipmentAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEquipmentAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEquipmentAdminRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
