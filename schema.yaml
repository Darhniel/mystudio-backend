components:
  schemas:
    AdminBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
          description: Public identifier, generated on creation and never reused.
        studio:
          type: string
          format: uuid
          readOnly: true
          description: Studios deactivate instead of deleting, so history survives.
        customer_full_name:
          type: string
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
          description: Stored lower-case so guest lookups are case-insensitive.
        customer_phone:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
          description: Timezone-aware, on the hour, inside studio operating hours.
        end_time:
          type: string
          format: date-time
          readOnly: true
          description: Timezone-aware, on the hour, after start_time.
        duration_hours:
          type: integer
          readOnly: true
          description: Whole hours between start_time and end_time.
        studio_hourly_price_kobo:
          type: integer
          readOnly: true
          description: Snapshot of Studio.hourly_rate_kobo at booking time.
        studio_subtotal_kobo:
          type: integer
          readOnly: true
          description: studio_hourly_price_kobo x duration_hours.
        equipment_subtotal_kobo:
          type: integer
          readOnly: true
          description: Sum of the equipment line subtotals; fixed per booking.
        total_amount_kobo:
          type: integer
          readOnly: true
          description: studio_subtotal_kobo + equipment_subtotal_kobo. 100% upfront.
        status:
          allOf:
          - $ref: '#/components/schemas/AdminBookingStatusEnum'
          readOnly: true
        payment_hold_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When an unpaid hold lapses. Required while the booking is pending
            payment so the expiration sweep can always find it.
        terms_accepted_at:
          type: string
          format: date-time
          readOnly: true
          description: When the customer accepted the terms. No refunds, no self-cancellation.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer_email
      - customer_full_name
      - customer_phone
      - duration_hours
      - end_time
      - equipment_subtotal_kobo
      - id
      - payment_hold_expires_at
      - reference
      - start_time
      - status
      - studio
      - studio_hourly_price_kobo
      - studio_subtotal_kobo
      - terms_accepted_at
      - total_amount_kobo
      - updated_at
    AdminBookingStatusEnum:
      enum:
      - pending_payment
      - confirmed
      - expired
      - completed
      - cancelled
      type: string
      description: |-
        * `pending_payment` - Pending payment
        * `confirmed` - Confirmed
        * `expired` - Expired
        * `completed` - Completed
        * `cancelled` - Cancelled
    AdminPayment:
      type: object
      description: Administrative payment details with booking context.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        paystack_reference:
          type: string
          readOnly: true
          description: Unique reference sent to Paystack. Used for idempotency.
        paystack_transaction_id:
          type: string
          readOnly: true
          nullable: true
          description: Paystack's internal transaction ID, populated on success.
        amount_kobo:
          type: integer
          readOnly: true
          description: Exact amount charged, copied from Booking.total_amount_kobo
            at initialization time. Never accepted from the frontend.
        currency:
          type: string
          readOnly: true
          description: Always NGN for this platform.
        status:
          allOf:
          - $ref: '#/components/schemas/AdminPaymentStatusEnum'
          readOnly: true
        payment_channel:
          type: string
          readOnly: true
          description: Payment channel reported by Paystack (e.g., 'card', 'bank',
            'ussd', 'mobile_money'). Empty until a successful charge.
        initialized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When Paystack returned the authorization URL.
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When Paystack reported the charge as successful.
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When our server verified the transaction with Paystack.
        review_reason:
          type: string
          readOnly: true
          description: Why this payment requires manual review. Empty when status
            is not REQUIRES_REVIEW.
        created_at:
          type: string
          format: date-time
          readOnly: true
        booking_reference:
          type: string
        customer_email:
          type: string
      required:
      - amount_kobo
      - booking_reference
      - created_at
      - currency
      - customer_email
      - id
      - initialized_at
      - paid_at
      - payment_channel
      - paystack_reference
      - paystack_transaction_id
      - review_reason
      - status
      - verified_at
    AdminPaymentStatusEnum:
      enum:
      - initializing
      - initialized
      - success
      - failed
      - abandoned
      - requires_review
      - pending
      - ongoing
      - processing
      - reversed
      type: string
      description: |-
        * `initializing` - Initializing
        * `initialized` - Initialized
        * `success` - Success
        * `failed` - Failed
        * `abandoned` - Abandoned
        * `requires_review` - Requires review
        * `pending` - Pending
        * `ongoing` - Ongoing
        * `processing` - Processing
        * `reversed` - Reversed
    AuthResponse:
      type: object
      description: Response returned by login.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - access
      - refresh
      - user
    BlockedSlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        studio_name:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        reason:
          type: string
          description: Why the studio is unavailable. Required for auditability.
          maxLength: 200
        created_by_email:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by_email
      - end_time
      - id
      - reason
      - start_time
      - studio_name
    BlockedSlotRequest:
      type: object
      properties:
        studio_id:
          type: string
          format: uuid
          writeOnly: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          description: Why the studio is unavailable. Required for auditability.
          maxLength: 200
      required:
      - end_time
      - reason
      - start_time
      - studio_id
    BookingCreate:
      type: object
      properties:
        studio_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        start_time:
          type: string
          description: Time in HH:MM format, e.g., '10:00'
        duration_hours:
          type: integer
          maximum: 9
          minimum: 1
        customer:
          $ref: '#/components/schemas/Customer'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentItem'
        terms_accepted:
          type: boolean
      required:
      - customer
      - date
      - duration_hours
      - start_time
      - studio_id
      - terms_accepted
    BookingCreateRequest:
      type: object
      properties:
        studio_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        start_time:
          type: string
          minLength: 1
          description: Time in HH:MM format, e.g., '10:00'
        duration_hours:
          type: integer
          maximum: 9
          minimum: 1
        customer:
          $ref: '#/components/schemas/CustomerRequest'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentItemRequest'
        terms_accepted:
          type: boolean
      required:
      - customer
      - date
      - duration_hours
      - start_time
      - studio_id
      - terms_accepted
    BookingResponse:
      type: object
      properties:
        booking_reference:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
        duration_hours:
          type: integer
        studio_amount_kobo:
          type: integer
        equipment_amount_kobo:
          type: integer
        total_amount_kobo:
          type: integer
        currency:
          type: string
          default: NGN
        payment_required:
          type: boolean
          readOnly: true
      required:
      - booking_reference
      - duration_hours
      - equipment_amount_kobo
      - expires_at
      - payment_required
      - status
      - studio_amount_kobo
      - total_amount_kobo
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    Customer:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 20
      required:
      - email
      - full_name
      - phone
    CustomerRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - email
      - full_name
      - phone
    EquipmentAdmin:
      type: object
      description: |-
        Create/update payload and administrative representation of an item.

        ``image`` uploads or replaces the single image; ``remove_image`` clears it.
        Both are write-only, and ``cloudinary_public_id`` is never exposed here.
        ``remove_image`` is rejected on create since there is no image to remove.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
        fixed_price_kobo:
          type: integer
          maximum: 2147483647
          minimum: 1
        stock_quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        image_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          description: Inactive items are hidden from customers and kept for history.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - fixed_price_kobo
      - id
      - image_url
      - name
      - stock_quantity
      - updated_at
    EquipmentAdminRequest:
      type: object
      description: |-
        Create/update payload and administrative representation of an item.

        ``image`` uploads or replaces the single image; ``remove_image`` clears it.
        Both are write-only, and ``cloudinary_public_id`` is never exposed here.
        ``remove_image`` is rejected on create since there is no image to remove.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        fixed_price_kobo:
          type: integer
          maximum: 2147483647
          minimum: 1
        stock_quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
          description: Inactive items are hidden from customers and kept for history.
        image:
          type: string
          format: binary
          writeOnly: true
        remove_image:
          type: boolean
          writeOnly: true
          default: false
      required:
      - fixed_price_kobo
      - name
      - stock_quantity
    EquipmentImage:
      type: object
      description: The image fields of an equipment item.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        image_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
        cloudinary_public_id:
          type: string
          readOnly: true
          nullable: true
          description: Cloudinary identifier, set together with image_url.
      required:
